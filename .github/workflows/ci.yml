name: test

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q modules demo.py

      - name: Run unit tests
        run: python -m unittest discover -s modules -p "test_module_*.py" -v

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Windows demo dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[demo]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Windows entry points
        run: python -m compileall -q modules demo.py

      - name: Run Windows demo tests
        run: python -m unittest modules.module_06_demo_evaluation.tests.test_module_06 -v
